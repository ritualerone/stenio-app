<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stenio Advocacia - Controle de Repasses</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--navy:#0f1e35;--gold:#c9a84c;--gold2:#e8c97a;--cream:#f8f5ef;--cream2:#ede9e0;--white:#fff;--text:#1a1a2e;--muted:#6b7280;--green:#15803d;--red:#dc2626;--amber:#d97706;--border:#e2d9c8}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
.app{display:flex;min-height:100vh}.sb{width:250px;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0}
.sb-logo{padding:24px 20px;border-bottom:1px solid rgba(201,168,76,.2)}.sb-title{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--gold2)}
.sb-sub{font-size:.65rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}.sb-nav{flex:1;padding:12px}
.nav-btn{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:rgba(255,255,255,.65);font-size:.85rem;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;margin-bottom:2px}
.nav-btn:hover,.nav-btn.active{background:rgba(201,168,76,.15);color:var(--gold2)}.main{margin-left:250px;flex:1;display:flex;flex-direction:column}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.tb-title{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--navy)}.tb-sub{font-size:.78rem;color:var(--muted);margin-top:1px}.body{padding:28px}
.card{background:var(--white);border-radius:12px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(15,30,53,.06);margin-bottom:18px}
.card-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-t{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--navy)}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.sc{background:var(--white);border-radius:12px;padding:18px 20px;border:1px solid var(--border)}.sc-l{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.sc-v{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--navy);margin-top:4px}.sc-v.g{color:var(--green)}.sc-v.a{color:var(--amber)}.sc-v.r{color:var(--red)}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:.7rem;font-weight:600}
.bg{background:#dcfce7;color:var(--green)}.br{background:#fee2e2;color:var(--red)}.ba{background:#fef3c7;color:var(--amber)}.bx{background:var(--cream2);color:var(--muted)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.83rem}thead tr{background:var(--cream);border-bottom:1px solid var(--border)}
th{padding:10px 12px;text-align:left;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--cream2);vertical-align:middle}tbody tr:last-child td{border-bottom:none}tbody tr:hover td{background:var(--cream)}
.tr-tot td{font-weight:700;background:var(--cream);font-family:'Playfair Display',serif}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:.82rem;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.btn-p{background:var(--navy);color:#fff}.btn-g{background:var(--gold);color:var(--navy)}.btn-o{background:transparent;color:var(--navy);border:1.5px solid var(--border)}
.btn-s{background:var(--green);color:#fff}.btn-d{background:var(--red);color:#fff}.btn.sm{padding:4px 10px;font-size:.75rem}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.fgg{display:flex;flex-direction:column;gap:4px}.fgg.full{grid-column:1/-1}
label{font-size:.72rem;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;color:var(--text);background:var(--white);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy)}
.mo{position:fixed;inset:0;background:rgba(15,30,53,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--white);border-radius:14px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;padding:24px}
.alert{padding:10px 14px;border-radius:8px;font-size:.83rem;margin-bottom:14px}.alert-e{background:#fee2e2;color:var(--red)}.alert-s{background:#dcfce7;color:var(--green)}
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--cream);border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:2px;background:var(--cream2);padding:3px;border-radius:8px}.tab{flex:1;padding:6px 12px;border:none;border-radius:6px;background:transparent;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.active{background:var(--white);color:var(--navy)}.loading{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:14px;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.late-row td{background:rgba(220,38,38,.04)!important}
</style></head><body>
<div class="app">
<aside class="sb">
  <div class="sb-logo"><div class="sb-title">Stenio Advocacia</div><div class="sb-sub">Controle de Repasses</div></div>
  <nav class="sb-nav">
    <button class="nav-btn active" id="nav-dashboard" onclick="go('dashboard')">Dashboard</button>
    <button class="nav-btn" id="nav-acordos" onclick="go('acordos')">Acordos &amp; Repasses</button>
    <button class="nav-btn" id="nav-novo" onclick="go('novo')">+ Novo Acordo</button>
  </nav>
</aside>
<div class="main" id="mc"><div class="loading"><div class="spin"></div><span>Carregando...</span></div></div>
</div>
<script>
var sb=supabase.createClient("https://bmfnclyvvwvyefdopixv.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtZm5jbHl2dnd2eWVmZG9waXh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NDU2ODUsImV4cCI6MjA5MzUyMTY4NX0.lb9HOhvKM6K1NhsebK9sogRu35DDOwuA2WjD2hS-rZ0");
var curAcordo=null;
var dP=[],dA=null,dFil="todos";
var aData=[],aFil="todos",aBus="";
var prev=[];

function fmt(v){if(v==null||v==="")return"--";return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(+v);}
function fmtD(s){if(!s)return"--";try{return new Date(s+"T12:00:00").toLocaleDateString("pt-BR");}catch(e){return s;}}
function isLate(p){return p.situacao==="Aberto"&&p.data_vencimento&&new Date(p.data_vencimento)<new Date();}
function badge(s){var m={Quitado:"bg",Aberto:"ba",Atrasado:"br",Parcial:"bx"};return "<span class=\"badge "+(m[s]||"bx")+"\">"+s+"</span>";}
function mc(){return document.getElementById("mc");}

function go(p,d){
  curAcordo=d||curAcordo;
  document.querySelectorAll(".nav-btn").forEach(function(b){b.classList.remove("active");});
  var nb=document.getElementById("nav-"+(p==="detalhe"?"acordos":p));
  if(nb)nb.classList.add("active");
  window.scrollTo(0,0);
  if(p==="dashboard")rDash();
  else if(p==="acordos")rAcordos();
  else if(p==="detalhe")rDetalhe();
  else if(p==="novo")rNovo();
}

async function rDash(){
  mc().innerHTML="<div class=\"loading\"><div class=\"spin\"></div><span>Carregando...</span></div>";
  var res=await sb.from("parcelas").select("*,acordos(cliente,numero_processo)").order("data_vencimento",{ascending:true});
  var p=res.data||[];
  var tot=p.reduce(function(s,x){return s+(+x.valor_total||0);},0);
  var rec=p.reduce(function(s,x){return s+(+x.valor_recebido||0);},0);
  var rep=p.reduce(function(s,x){return s+(+x.valor_repassado||0);},0);
  var ea=p.filter(function(x){return x.situacao==="Aberto";}).reduce(function(s,x){return s+(+x.valor_total||0);},0);
  var qt=p.filter(function(x){return x.situacao==="Quitado";}).length;
  var ab=p.filter(function(x){return x.situacao==="Aberto";}).length;
  var at=p.filter(function(x){return isLate(x);}).length;
  var prox=p.filter(function(x){return x.situacao==="Aberto";}).slice(0,8);
  window._dashAcordos=prox.map(function(x){return x.acordos;});
  var rows=prox.map(function(x,i){
    var l=isLate(x);
    return "<tr class=\""+(l?"late-row":"")+"\"><td onclick=\"goDetalhe("+i+")\" style=\"cursor:pointer\"><strong>"+(x.acordos?x.acordos.cliente:"")+"</strong></td><td>"+( x.acordos?x.acordos.numero_processo:"")+"</td><td>"+x.numero_parcela+"</td><td style=\"color:"+(l?"var(--red)":"inherit")+";font-weight:"+(l?600:400)+"\">"+fmtD(x.data_vencimento)+(l?" !":"")+"</td><td>"+fmt(x.valor_total)+"</td><td>"+badge(l?"Atrasado":x.situacao)+"</td></tr>";
  }).join("");
  mc().innerHTML="<div class=\"topbar\"><div><div class=\"tb-title\">Dashboard</div><div class=\"tb-sub\">Stenio Advocacia</div></div></div>"
    +"<div class=\"body\"><div class=\"sg\">"
    +"<div class=\"sc\" style=\"background:var(--navy);border-color:var(--gold)\"><div class=\"sc-l\" style=\"color:rgba(255,255,255,.5)\">Total Geral</div><div class=\"sc-v\" style=\"color:var(--gold2)\">"+fmt(tot)+"</div></div>"
    +"<div class=\"sc\"><div class=\"sc-l\">Recebido</div><div class=\"sc-v g\">"+fmt(rec)+"</div></div>"
    +"<div class=\"sc\"><div class=\"sc-l\">Repassado</div><div class=\"sc-v g\">"+fmt(rep)+"</div></div>"
    +"<div class=\"sc\"><div class=\"sc-l\">Em Aberto</div><div class=\"sc-v a\">"+fmt(ea)+"</div></div></div>"
    +"<div class=\"sg\" style=\"grid-template-columns:repeat(3,1fr)\"><div class=\"sc\"><div class=\"sc-l\">Quitadas</div><div class=\"sc-v\">"+qt+"</div></div><div class=\"sc\"><div class=\"sc-l\">Abertas</div><div class=\"sc-v a\">"+ab+"</div></div><div class=\"sc\"><div class=\"sc-l\">Atrasadas</div><div class=\"sc-v "+(at>0?"r":"")+"\">"+at+"</div></div></div>"
    +"<div class=\"card\"><div class=\"card-h\"><div class=\"card-t\">Proximas Parcelas em Aberto</div><button class=\"btn btn-o sm\" onclick=\"go('acordos')\">Ver todos</button></div>"
    +(prox.length===0?"<div class=\"empty\">Nenhuma parcela em aberto</div>":"<div class=\"tw\"><table><thead><tr><th>Cliente</th><th>Processo</th><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Situacao</th></tr></thead><tbody>"+rows+"</tbody></table></div>")
    +"</div></div>";
}
function goDetalhe(i){var ac=window._dashAcordos&&window._dashAcordos[i];if(ac)go("detalhe",ac);}

async function rAcordos(){
  mc().innerHTML="<div class=\"loading\"><div class=\"spin\"></div></div>";
  var res=await sb.from("acordos").select("*,parcelas(*)").order("created_at",{ascending:false});
  aData=res.data||[];rAT();
}
function rAT(){
  var f=aData.filter(function(a){
    var ms=!aBus||a.cliente.toLowerCase().includes(aBus.toLowerCase())||a.numero_processo.toLowerCase().includes(aBus.toLowerCase());
    var ma=aFil==="todos"||(aFil==="ativos"?a.ativo:!a.ativo);
    return ms&&ma;
  });
  window._aList=f;
  var rows=f.map(function(a,i){
    var p=a.parcelas||[];
    var t=p.reduce(function(s,x){return s+(+x.valor_total||0);},0);
    var r=p.reduce(function(s,x){return s+(+x.valor_recebido||0);},0);
    var q=p.filter(function(x){return x.situacao==="Quitado";}).length;
    var ab2=p.filter(function(x){return x.situacao==="Aberto";}).length;
    var at=p.filter(function(x){return x.situacao==="Aberto"&&x.data_vencimento&&new Date(x.data_vencimento)<new Date();}).length;
    return "<tr><td><strong>"+a.cliente+"</strong></td><td style=\"font-family:monospace;font-size:.78rem\">"+a.numero_processo+"</td><td>"+p.length+"</td><td style=\"color:var(--green);font-weight:600\">"+q+"</td><td style=\"color:var(--amber);font-weight:600\">"+ab2+"</td><td>"+(at>0?"<span style=\"color:var(--red);font-weight:700\">! "+at+"</span>":"0")+"</td><td>"+fmt(t)+"</td><td>"+fmt(r)+"</td><td><span class=\"badge "+(a.ativo?"bg":"bx")+"\">"+( a.ativo?"Ativo":"Enc.")+"</span></td><td><div style=\"display:flex;gap:5px\"><button class=\"btn btn-o sm\" onclick=\"goAcordo("+i+")\">Ver</button><button class=\"btn sm\" style=\"background:var(--cream2);color:var(--muted)\" onclick=\"togAtivo('"+a.id+"',"+a.ativo+")\">"+(a.ativo?"||":">")+"</button><button class=\"btn btn-d sm\" onclick=\"delAc('"+a.id+"')\">X</button></div></td></tr>";
  }).join("");
  mc().innerHTML="<div class=\"topbar\"><div><div class=\"tb-title\">Acordos &amp; Repasses</div><div class=\"tb-sub\">"+aData.length+" acordo(s)</div></div><button class=\"btn btn-g\" onclick=\"go('novo')\">+ Novo Acordo</button></div>"
    +"<div class=\"body\"><div class=\"card\"><div class=\"fbar\"><input style=\"min-width:200px;width:auto\" placeholder=\"Buscar...\" value=\""+aBus+"\" oninput=\"aBus=this.value;rAT()\"><div class=\"tabs\"><button class=\"tab "+(aFil==="todos"?"active":"")+"\" onclick=\"aFil='todos';rAT()\">Todos</button><button class=\"tab "+(aFil==="ativos"?"active":"")+"\" onclick=\"aFil='ativos';rAT()\">Ativos</button><button class=\"tab "+(aFil==="inativos"?"active":"")+"\" onclick=\"aFil='inativos';rAT()\">Inativos</button></div></div>"
    +(f.length===0?"<div class=\"empty\">Nenhum acordo</div>":"<div class=\"tw\"><table><thead><tr><th>Cliente</th><th>Processo</th><th>Parc.</th><th>Quit.</th><th>Aber.</th><th>Atras.</th><th>Total</th><th>Recebido</th><th>Status</th><th>Acoes</th></tr></thead><tbody>"+rows+"</tbody></table></div>")
    +"</div></div>";
}
function goAcordo(i){var a=window._aList[i];if(a)go("detalhe",{id:a.id,cliente:a.cliente,numero_processo:a.numero_processo});}
async function togAtivo(id,v){await sb.from("acordos").update({ativo:!v}).eq("id",id);rAcordos();}
async function delAc(id){if(!confirm("Excluir este acordo e todas as parcelas?"))return;await sb.from("acordos").delete().eq("id",id);rAcordos();}

async function rDetalhe(){
  mc().innerHTML="<div class=\"loading\"><div class=\"spin\"></div></div>";
  var r1=await sb.from("acordos").select("*").eq("id",curAcordo.id).single();
  var r2=await sb.from("parcelas").select("*").eq("acordo_id",curAcordo.id).order("numero_parcela",{ascending:true});
  dA=r1.data;dP=r2.data||[];rDT();
}
function rDT(){
  var fi=dP.filter(function(p){
    if(dFil==="todos")return true;
    if(dFil==="aberto")return p.situacao==="Aberto";
    if(dFil==="quitado")return p.situacao==="Quitado";
    if(dFil==="atrasado")return isLate(p);
    return true;
  });
  var tG=dP.reduce(function(s,p){return s+(+p.valor_total||0);},0);
  var tR=dP.reduce(function(s,p){return s+(+p.valor_recebido||0);},0);
  var tRep=dP.reduce(function(s,p){return s+(+p.valor_repassado||0);},0);
  var tA=dP.filter(function(p){return p.situacao!=="Quitado";}).reduce(function(s,p){return s+(+p.valor_total||0);},0);
  window._pList=fi;
  var rows=fi.map(function(p,i){
    var l=isLate(p),ea=p.situacao==="Aberto"?(+p.valor_total||0):0;
    return "<tr class=\""+(l?"late-row":"")+"\"><td><strong>"+p.numero_parcela+"</strong>"+(l?" <span style=\"font-size:.68rem;color:var(--red)\">ATRASADA</span>":"")+"</td><td style=\"color:"+(l?"var(--red)":"inherit")+";font-weight:"+(l?600:400)+"\">"+fmtD(p.data_vencimento)+"</td><td>"+fmtD(p.data_pagamento)+"</td><td><strong>"+fmt(p.valor_total)+"</strong></td><td style=\"color:"+((+p.valor_recebido||0)>0?"var(--green)":"inherit")+"\">"+fmt(p.valor_recebido)+"</td><td style=\"color:"+((+p.valor_repassado||0)>0?"var(--green)":"inherit")+"\">"+fmt(p.valor_repassado)+"</td><td>"+fmtD(p.data_repasse)+"</td><td>"+fmtD(p.programacao_repasse)+"</td><td>"+(ea>0?"<span style=\"color:var(--amber);font-weight:600\">"+fmt(ea)+"</span>":"--")+"</td><td>"+badge(l?"Atrasado":p.situacao)+"</td><td><div style=\"display:flex;gap:4px\"><button class=\"btn btn-o sm\" onclick=\"openM("+i+")\">Editar</button>"+(p.situacao==="Aberto"?"<button class=\"btn btn-s sm\" onclick=\"quitar('"+p.id+"',"+p.valor_total+")\">OK</button>":"")+"<button class=\"btn btn-d sm\" onclick=\"delP('"+p.id+"')\">X</button></div></td></tr>";
  }).join("");
  mc().innerHTML="<div class=\"topbar\"><div style=\"display:flex;align-items:center;gap:14px\"><button class=\"btn btn-o sm\" onclick=\"go('acordos')\">Voltar</button><div><div class=\"tb-title\">"+(dA?dA.cliente:"")+"</div><div class=\"tb-sub\">Processo: "+(dA?dA.numero_processo:"")+"</div></div></div><button class=\"btn btn-g\" onclick=\"openM()\">+ Parcela</button></div>"
    +"<div class=\"body\"><div class=\"sg\"><div class=\"sc\"><div class=\"sc-l\">Total</div><div class=\"sc-v\">"+fmt(tG)+"</div></div><div class=\"sc\"><div class=\"sc-l\">Recebido</div><div class=\"sc-v g\">"+fmt(tR)+"</div></div><div class=\"sc\"><div class=\"sc-l\">Repassado</div><div class=\"sc-v g\">"+fmt(tRep)+"</div></div><div class=\"sc\"><div class=\"sc-l\">Em Aberto</div><div class=\"sc-v a\">"+fmt(tA)+"</div></div></div>"
    +"<div class=\"card\"><div class=\"card-h\"><div class=\"card-t\">Parcelas</div><div style=\"display:flex;gap:8px;align-items:center\"><div class=\"tabs\"><button class=\"tab "+(dFil==="todos"?"active":"")+"\" onclick=\"dFil='todos';rDT()\">Todos</button><button class=\"tab "+(dFil==="aberto"?"active":"")+"\" onclick=\"dFil='aberto';rDT()\">Aberto</button><button class=\"tab "+(dFil==="quitado"?"active":"")+"\" onclick=\"dFil='quitado';rDT()\">Quitado</button><button class=\"tab "+(dFil==="atrasado"?"active":"")+"\" onclick=\"dFil='atrasado';rDT()\">Atrasado</button></div><button class=\"btn btn-g sm\" onclick=\"openM()\">+</button></div></div>"
    +(fi.length===0?"<div class=\"empty\">Nenhuma parcela</div>":"<div class=\"tw\"><table><thead><tr><th>Parc.</th><th>Venc.</th><th>Pag.</th><th>Total</th><th>Recebido</th><th>Repassado</th><th>Dt.Repasse</th><th>Prog.Repasse</th><th>Em Aberto</th><th>Situacao</th><th>Acoes</th></tr></thead><tbody>"+rows+"</tbody><tfoot><tr class=\"tr-tot\"><td colspan=\"3\">Somatorio</td><td>"+fmt(tG)+"</td><td>"+fmt(tR)+"</td><td>"+fmt(tRep)+"</td><td colspan=\"2\"></td><td>"+fmt(tA)+"</td><td colspan=\"2\"></td></tr></tfoot></table></div>")
    +"</div></div>";
}
async function quitar(id,v){await sb.from("parcelas").update({situacao:"Quitado",valor_recebido:v,data_pagamento:new Date().toISOString().split("T")[0]}).eq("id",id);var r=await sb.from("parcelas").select("*").eq("acordo_id",curAcordo.id).order("numero_parcela",{ascending:true});dP=r.data||[];rDT();}
async function delP(id){if(!confirm("Excluir esta parcela?"))return;await sb.from("parcelas").delete().eq("id",id);var r=await sb.from("parcelas").select("*").eq("acordo_id",curAcordo.id).order("numero_parcela",{ascending:true});dP=r.data||[];rDT();}

function openM(idx){
  var par=idx!==undefined?window._pList[idx]:null;
  var nN=dP.length>0?Math.max.apply(null,dP.map(function(x){return x.numero_parcela;}))+1:1;
  var p=par||{};
  var el=document.createElement("div");el.id="mo";el.className="mo";
  el.innerHTML="<div class=\"modal\"><div style=\"display:flex;justify-content:space-between;margin-bottom:18px\"><strong>"+(par?"Editar Parcela N "+par.numero_parcela:"Nova Parcela")+"</strong><button onclick=\"document.getElementById('mo').remove()\">X</button></div><div class=\"fg\"><div class=\"fgg\"><label>N Parcela</label><input type=\"number\" id=\"f_num\" value=\""+(p.numero_parcela!=null?p.numero_parcela:nN)+"\" ></div><div class=\"fgg\"><label>Situacao</label><select id=\"f_sit\"><option "+( (!p.situacao||p.situacao==="Aberto")?"selected":"")+">Aberto</option><option "+(p.situacao==="Quitado"?"selected":"")+">Quitado</option><option "+(p.situacao==="Parcial"?"selected":"")+">Parcial</option></select></div><div class=\"fgg\"><label>Vencimento</label><input type=\"date\" id=\"f_ven\" value=\""+(p.data_vencimento||"")+"\"></div><div class=\"fgg\"><label>Pagamento</label><input type=\"date\" id=\"f_pag\" value=\""+(p.data_pagamento||"")+"\"></div><div class=\"fgg\"><label>Valor Total</label><input type=\"number\" step=\".01\" id=\"f_vt\" value=\""+(p.valor_total||"")+"\"></div><div class=\"fgg\"><label>Recebido</label><input type=\"number\" step=\".01\" id=\"f_vr\" value=\""+(p.valor_recebido||"")+"\"></div><div class=\"fgg\"><label>Repassado</label><input type=\"number\" step=\".01\" id=\"f_vrep\" value=\""+(p.valor_repassado||"")+"\"></div><div class=\"fgg\"><label>Data Repasse</label><input type=\"date\" id=\"f_drep\" value=\""+(p.data_repasse||"")+"\"></div><div class=\"fgg\"><label>Prog. Repasse</label><input type=\"date\" id=\"f_prog\" value=\""+(p.programacao_repasse||"")+"\"></div><div class=\"fgg full\"><label>Observacoes</label><textarea rows=\"2\" id=\"f_obs\">"+(p.observacoes||"")+"</textarea></div></div><div style=\"display:flex;justify-content:flex-end;gap:10px;margin-top:18px\"><button class=\"btn btn-o\" onclick=\"document.getElementById('mo').remove()\">Cancelar</button><button class=\"btn btn-p\" onclick=\"saveP('"+( par?par.id:"")+"')\">Salvar</button></div></div>";
  el.onclick=function(e){if(e.target===el)el.remove();};
  document.body.appendChild(el);
}
async function saveP(pid){
  var data={acordo_id:curAcordo.id,numero_parcela:+document.getElementById("f_num").value,situacao:document.getElementById("f_sit").value,data_vencimento:document.getElementById("f_ven").value||null,data_pagamento:document.getElementById("f_pag").value||null,valor_total:+(document.getElementById("f_vt").value)||0,valor_recebido:+(document.getElementById("f_vr").value)||0,valor_repassado:+(document.getElementById("f_vrep").value)||0,data_repasse:document.getElementById("f_drep").value||null,programacao_repasse:document.getElementById("f_prog").value||null,observacoes:document.getElementById("f_obs").value||null};
  if(pid){await sb.from("parcelas").update(data).eq("id",pid);}else{await sb.from("parcelas").insert(data);}
  document.getElementById("mo").remove();
  var r=await sb.from("parcelas").select("*").eq("acordo_id",curAcordo.id).order("numero_parcela",{ascending:true});
  dP=r.data||[];rDT();
}

function rNovo(){
  mc().innerHTML="<div class=\"topbar\"><div style=\"display:flex;align-items:center;gap:14px\"><button class=\"btn btn-o sm\" onclick=\"go('acordos')\">Voltar</button><div class=\"tb-title\">Novo Acordo</div></div><button class=\"btn btn-p\" onclick=\"criarAcordo()\">Criar Acordo</button></div>"
    +"<div class=\"body\"><div id=\"ne\"></div>"
    +"<div class=\"card\" style=\"margin-bottom:18px\"><div class=\"card-h\"><div class=\"card-t\">Dados</div></div><div style=\"padding:20px\"><div class=\"fg\"><div class=\"fgg\"><label>Cliente *</label><input id=\"n_cli\" placeholder=\"Nome completo\"></div><div class=\"fgg\"><label>Processo *</label><input id=\"n_proc\" placeholder=\"5215765-28\"></div><div class=\"fgg full\"><label>Descricao</label><input id=\"n_desc\"></div><div class=\"fgg\"><label>Status</label><select id=\"n_at\"><option value=\"1\">Ativo</option><option value=\"0\">Encerrado</option></select></div></div></div></div>"
    +"<div class=\"card\" style=\"margin-bottom:18px\"><div class=\"card-h\"><div class=\"card-t\">Gerador de Parcelas</div></div><div style=\"padding:20px\"><div class=\"fg\"><div class=\"fgg\"><label>Qtd</label><input type=\"number\" id=\"n_q\"></div><div class=\"fgg\"><label>Valor R$</label><input type=\"number\" step=\".01\" id=\"n_v\"></div><div class=\"fgg\"><label>1a Parcela</label><input type=\"date\" id=\"n_d\"></div><div class=\"fgg\"><label>Frequencia</label><select id=\"n_f\"><option value=\"mensal\">Mensal</option><option value=\"quinzenal\">Quinzenal</option><option value=\"semanal\">Semanal</option></select></div></div><button class=\"btn btn-o\" style=\"margin-top:14px\" onclick=\"gprev()\">Preview</button></div></div>"
    +"<div id=\"prev-area\"></div></div>";
}
function gprev(){
  var q=+document.getElementById("n_q").value,v=+document.getElementById("n_v").value,d=document.getElementById("n_d").value,f=document.getElementById("n_f").value;
  if(!q||!v||!d){document.getElementById("ne").innerHTML="<div class=\"alert alert-e\">Preencha quantidade, valor e data.</div>";return;}
  document.getElementById("ne").innerHTML="";
  var list=[],base=new Date(d+"T12:00:00");
  for(var i=0;i<q;i++){var x=new Date(base);if(f==="mensal")x.setMonth(x.getMonth()+i);else if(f==="quinzenal")x.setDate(x.getDate()+15*i);else x.setDate(x.getDate()+7*i);list.push({n:i+1,d:x.toISOString().split("T")[0],v:v});}
  prev=list;
  document.getElementById("prev-area").innerHTML="<div class=\"card\"><div class=\"card-h\"><div class=\"card-t\">Preview - "+list.length+" parcelas</div><div style=\"color:var(--muted);font-size:.8rem\">Total: "+fmt(list.reduce(function(s,p){return s+p.v;},0))+"</div></div><div class=\"tw\"><table><thead><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th></tr></thead><tbody>"+list.map(function(p){return"<tr><td>"+p.n+"</td><td>"+new Date(p.d+"T12:00:00").toLocaleDateString("pt-BR")+"</td><td>"+fmt(p.v)+"</td></tr>";}).join("")+"</tbody></table></div></div>";
}
async function criarAcordo(){
  var cli=document.getElementById("n_cli").value.trim(),proc=document.getElementById("n_proc").value.trim();
  if(!cli||!proc){document.getElementById("ne").innerHTML="<div class=\"alert alert-e\">Cliente e processo obrigatorios.</div>";return;}
  document.getElementById("ne").innerHTML="<div class=\"alert\" style=\"background:#fef3c7;color:var(--amber)\">Salvando...</div>";
  try{
    var r=await sb.from("acordos").insert({cliente:cli,numero_processo:proc,descricao:document.getElementById("n_desc").value||null,ativo:document.getElementById("n_at").value==="1"}).select().single();
    if(r.error)throw r.error;
    if(prev.length>0){var r2=await sb.from("parcelas").insert(prev.map(function(p){return{acordo_id:r.data.id,numero_parcela:p.n,data_vencimento:p.d,valor_total:p.v,situacao:"Aberto"};}));if(r2.error)throw r2.error;}
    prev=[];go("detalhe",r.data);
  }catch(e){document.getElementById("ne").innerHTML="<div class=\"alert alert-e\">Erro: "+e.message+"</div>";}
}
go("dashboard");
</script></body></html>
